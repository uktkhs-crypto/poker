<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#1e3a5f"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="ポーカードリル"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="format-detection" content="telephone=no"/>
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20192%20192'%3E%3Crect%20width%3D'192'%20height%3D'192'%20rx%3D'36'%20fill%3D'%231e3a5f'%2F%3E%3Ctext%20x%3D'96'%20y%3D'128'%20font-size%3D'110'%20text-anchor%3D'middle'%20fill%3D'%23f7f4ec'%20font-family%3D'sans-serif'%20font-weight%3D'700'%3E%E2%99%A0%3C%2Ftext%3E%3C%2Fsvg%3E"/>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20192%20192'%3E%3Crect%20width%3D'192'%20height%3D'192'%20rx%3D'36'%20fill%3D'%231e3a5f'%2F%3E%3Ctext%20x%3D'96'%20y%3D'128'%20font-size%3D'110'%20text-anchor%3D'middle'%20fill%3D'%23f7f4ec'%20font-family%3D'sans-serif'%20font-weight%3D'700'%3E%E2%99%A0%3C%2Ftext%3E%3C%2Fsvg%3E"/>
<title>ポーカースキル上達ドリル</title>
<style>/* ポーカースキル上達ドリル - デザインシステム
   シンプル・知的・落ち着き。ネイビー×アイボリー×アクセント少量。ライトモード優先。 */

:root {
  --c-bg: #f7f4ec;
  --c-surface: #ffffff;
  --c-surface-2: #f0ece2;
  --c-ink: #1a2438;
  --c-ink-2: #4b5468;
  --c-muted: #8892a4;
  --c-line: #d9d2c1;
  --c-primary: #1e3a5f;
  --c-primary-2: #2d5083;
  --c-accent: #b8875a;
  --c-ok: #3d7a56;
  --c-warn: #b06a2d;
  --c-err: #a83d3d;
  --c-info: #2f6b8f;
  --c-heart: #a83d3d;
  --c-diamond: #2f6b8f;
  --c-club: #3d7a56;
  --c-spade: #1a2438;
  --shadow-sm: 0 1px 2px rgba(26,36,56,.08);
  --shadow-md: 0 4px 12px rgba(26,36,56,.10);
  --radius: 12px;
  --radius-sm: 8px;
  --f-base: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif;
  --tap: 44px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--f-base);
  background: var(--c-bg);
  color: var(--c-ink);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font-family: inherit; font-size: 15px; }
a { color: var(--c-primary-2); text-decoration: none; }

/* ------ App shell ------ */
#app { max-width: 720px; margin: 0 auto; padding-bottom: 76px; min-height: 100vh; }
header.appbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: var(--c-surface); border-bottom: 1px solid var(--c-line);
  position: sticky; top: 0; z-index: 50;
}
header.appbar .brand { font-weight: 700; font-size: 16px; color: var(--c-primary); letter-spacing: .02em; }
header.appbar .menu-btn { padding: 8px 10px; border-radius: var(--radius-sm); font-size: 13px; color: var(--c-ink-2); }
header.appbar .menu-btn:hover { background: var(--c-surface-2); }

main { padding: 16px; }
.page-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; color: var(--c-ink); }
.page-sub { color: var(--c-muted); font-size: 13px; margin-bottom: 16px; }

/* ------ Bottom nav ------ */
nav.bottom {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  background: var(--c-surface); border-top: 1px solid var(--c-line);
  display: flex; padding: 6px 0 max(6px, env(safe-area-inset-bottom));
}
nav.bottom button {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 4px; color: var(--c-muted); font-size: 11px;
}
nav.bottom button.active { color: var(--c-primary); }
nav.bottom button .icn { font-size: 20px; line-height: 1; }

/* ------ Cards / buttons ------ */
.card {
  background: var(--c-surface); border: 1px solid var(--c-line);
  border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.card h3 { font-size: 15px; margin-bottom: 8px; color: var(--c-primary); }
.card .sub { color: var(--c-muted); font-size: 12px; }

.btn { display: inline-flex; align-items: center; justify-content: center;
  min-height: var(--tap); padding: 10px 16px; border-radius: var(--radius-sm);
  font-weight: 600; font-size: 14px; transition: transform .05s; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--c-primary); color: #fff; }
.btn.primary:hover { background: var(--c-primary-2); }
.btn.ghost { background: var(--c-surface-2); color: var(--c-ink); border: 1px solid var(--c-line); }
.btn.ok { background: var(--c-ok); color: #fff; }
.btn.warn { background: var(--c-warn); color: #fff; }
.btn.err { background: var(--c-err); color: #fff; }
.btn.block { display: flex; width: 100%; }
.btn.lg { min-height: 56px; font-size: 16px; }
.btn.xl { min-height: 72px; font-size: 18px; font-weight: 700; letter-spacing: .02em; }

.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row.tight { gap: 4px; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.grid-stat { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
.stat-box { background: var(--c-surface-2); border-radius: var(--radius-sm); padding: 10px; }
.stat-box .k { font-size: 11px; color: var(--c-muted); }
.stat-box .v { font-size: 18px; font-weight: 700; color: var(--c-ink); }

/* ------ Home CTA ------ */
.cta-hero {
  background: linear-gradient(135deg, var(--c-primary), var(--c-primary-2));
  color: #fff; border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow-md); margin-bottom: 16px;
}
.cta-hero .lead { font-size: 12px; opacity: .85; letter-spacing: .05em; }
.cta-hero .title { font-size: 22px; font-weight: 700; margin: 4px 0 12px; }
.cta-hero .btn { background: #fff; color: var(--c-primary); width: 100%; }
.cta-hero .btn:hover { background: #eeeae0; }

/* ------ Poker table SVG ------ */
.table-wrap { background: var(--c-surface); border: 1px solid var(--c-line);
  border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
.table-title { font-size: 12px; color: var(--c-muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
svg.table-svg { display: block; width: 100%; height: auto; }

.seat-label { font-size: 11px; font-weight: 700; }
.seat-hero { fill: var(--c-primary); }
.seat-active { fill: #ffffff; stroke: var(--c-ink); }
.seat-folded { fill: #e8e2d0; stroke: var(--c-muted); opacity: .55; }
.seat-actioned { fill: #d9e5f2; stroke: var(--c-primary-2); }
.seat-allin { fill: var(--c-warn); stroke: var(--c-warn); }
.pot-chip { fill: var(--c-accent); }

/* ------ Cards ------ */
.cards-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.card-face {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  width: 44px; height: 60px; background: #fff; border: 1.5px solid var(--c-ink);
  border-radius: 6px; font-weight: 700; font-size: 18px; line-height: 1;
  box-shadow: var(--shadow-sm);
}
.card-face.lg { width: 56px; height: 76px; font-size: 22px; }
.card-face.h { color: var(--c-heart); }
.card-face.d { color: var(--c-diamond); }
.card-face.c { color: var(--c-club); }
.card-face.s { color: var(--c-spade); }
.card-face.two-color.d { color: var(--c-heart); }
.card-face.two-color.c { color: var(--c-spade); }
.card-face .suit { font-size: 20px; }
.card-face.lg .suit { font-size: 26px; }
.card-back { background: linear-gradient(45deg, var(--c-primary), var(--c-primary-2)); color: #fff; }

.card-group-label { font-size: 11px; color: var(--c-muted); margin-right: 6px; letter-spacing: .05em; }

/* ------ Pot / stack indicators ------ */
.pot-box {
  background: var(--c-surface-2); border-radius: var(--radius-sm); padding: 10px 12px;
  display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
}
.pot-box .chip { width: 28px; height: 28px; border-radius: 50%;
  background: var(--c-accent); border: 3px solid #fff;
  box-shadow: 0 0 0 1.5px var(--c-accent); }
.pot-box .pot-v { font-weight: 700; font-size: 16px; }
.pot-box .pot-l { font-size: 11px; color: var(--c-muted); margin-left: auto; }

.stack-gauge { position: relative; height: 10px; background: var(--c-surface-2);
  border-radius: 5px; overflow: hidden; margin-top: 2px; }
.stack-gauge .fill { height: 100%; background: var(--c-primary); border-radius: 5px; }
.stack-gauge.short .fill { background: var(--c-err); }
.stack-gauge.mid .fill { background: var(--c-warn); }

/* ------ Action timeline ------ */
.timeline { border-left: 2px solid var(--c-line); padding-left: 12px; margin-left: 4px; }
.timeline .step { position: relative; padding: 6px 0; font-size: 13px; }
.timeline .step::before {
  content: ""; position: absolute; left: -18px; top: 12px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--c-primary);
}
.timeline .step.folded::before { background: var(--c-muted); }
.timeline .step.hero::before { background: var(--c-accent); box-shadow: 0 0 0 3px rgba(184,135,90,.25); }
.timeline .street { color: var(--c-muted); font-size: 11px; margin: 6px 0 2px; letter-spacing: .1em; }
.timeline .pos { display: inline-block; background: var(--c-surface-2); border-radius: 4px;
  padding: 1px 6px; font-size: 11px; font-weight: 700; margin-right: 6px; }

/* ------ Action buttons ------ */
.act-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 8px; }
.act-grid .btn { min-height: 54px; font-size: 15px; }
.size-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 8px; }
.size-grid .btn { min-height: 48px; font-size: 13px; padding: 8px; flex-direction: column; }
.size-grid .btn .amt { font-size: 11px; color: var(--c-muted); font-weight: 500; }
.size-grid .btn.primary .amt { color: rgba(255,255,255,.85); }

.conf-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }
.conf-grid .btn { min-height: 44px; font-size: 12px; padding: 4px; }

/* ------ Explanation ------ */
.expl-verdict {
  padding: 14px; border-radius: var(--radius); margin-bottom: 12px;
  border: 2px solid; font-weight: 600;
}
.expl-verdict.correct { background: #eaf3ee; border-color: var(--c-ok); color: var(--c-ok); }
.expl-verdict.partial { background: #fbf1e5; border-color: var(--c-warn); color: var(--c-warn); }
.expl-verdict.wrong { background: #f5e6e6; border-color: var(--c-err); color: var(--c-err); }
.expl-verdict.mix { background: #eaf1f7; border-color: var(--c-info); color: var(--c-info); }
.expl-verdict h3 { font-size: 16px; margin-bottom: 4px; }
.expl-verdict .sub { font-size: 13px; opacity: .9; }

.memory-line {
  background: var(--c-accent); color: #fff; padding: 12px 14px; border-radius: var(--radius);
  font-weight: 600; font-size: 14px; margin: 12px 0; display: flex; gap: 8px; align-items: flex-start;
}
.memory-line .icn { font-size: 20px; line-height: 1; }

/* Source badge */
.src-badge { display: inline-block; padding: 2px 8px; border-radius: 12px;
  font-size: 10px; font-weight: 700; letter-spacing: .05em; margin-right: 4px; }
.src-badge.solver { background: #2f6b8f22; color: #2f6b8f; border: 1px solid #2f6b8f55; }
.src-badge.theory { background: #3d7a5622; color: #3d7a56; border: 1px solid #3d7a5655; }
.src-badge.exploit { background: #b06a2d22; color: #b06a2d; border: 1px solid #b06a2d55; }
.src-badge.insufficient { background: #8892a422; color: #8892a4; border: 1px solid #8892a455; }

/* Range advantage bar */
.compare-bar { display: grid; grid-template-columns: 1fr 30px 1fr; gap: 8px; align-items: center; margin: 6px 0; }
.compare-bar .lbl { font-size: 11px; color: var(--c-muted); }
.compare-bar .bar { height: 10px; background: var(--c-surface-2); border-radius: 5px; overflow: hidden; }
.compare-bar .bar .fill { height: 100%; background: var(--c-primary); }
.compare-bar .bar.right { transform: scaleX(-1); }
.compare-bar .name { text-align: center; font-size: 11px; font-weight: 700; }

/* Accordion */
.acc { border: 1px solid var(--c-line); border-radius: var(--radius-sm); margin-bottom: 8px; overflow: hidden; }
.acc summary { padding: 12px 14px; background: var(--c-surface-2); font-weight: 600; font-size: 14px;
  cursor: pointer; user-select: none; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary::after { content: "＋"; color: var(--c-muted); }
.acc[open] summary::after { content: "－"; }
.acc .body { padding: 14px; background: #fff; font-size: 14px; }

/* Roadmap */
.stage { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--c-surface);
  border: 1px solid var(--c-line); border-radius: var(--radius); margin-bottom: 8px; }
.stage .lv-badge { min-width: 52px; height: 52px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--c-primary); color: #fff; font-weight: 700; font-size: 14px; }
.stage .stage-body { flex: 1; }
.stage .stage-title { font-weight: 700; font-size: 14px; color: var(--c-primary); }
.stage .stage-sub { font-size: 11px; color: var(--c-muted); }
.stage .progress { height: 6px; background: var(--c-surface-2); border-radius: 3px;
  overflow: hidden; margin-top: 6px; width: 100%; }
.stage .progress .fill { height: 100%; background: var(--c-ok); border-radius: 3px; }

.node-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.node-pill { font-size: 10px; padding: 3px 8px; border-radius: 12px;
  background: var(--c-surface-2); color: var(--c-ink-2); }
.node-pill.learning { background: #fbf1e5; color: var(--c-warn); }
.node-pill.mastered { background: #eaf3ee; color: var(--c-ok); }

/* Onboarding */
.ob-step { text-align: center; padding: 20px 0; }
.ob-step h2 { font-size: 22px; margin-bottom: 4px; color: var(--c-primary); }
.ob-step p { color: var(--c-muted); margin-bottom: 20px; font-size: 13px; }
.ob-step .options { display: flex; flex-direction: column; gap: 8px; max-width: 320px; margin: 0 auto; }
.ob-step .options .btn { justify-content: flex-start; text-align: left; padding: 14px 16px; }
.ob-step input[type="text"] { width: 100%; max-width: 320px; padding: 12px 14px;
  border: 1.5px solid var(--c-line); border-radius: var(--radius-sm); text-align: center; }
.ob-progress { height: 4px; background: var(--c-surface-2); border-radius: 2px;
  overflow: hidden; margin-bottom: 20px; }
.ob-progress .fill { height: 100%; background: var(--c-primary); transition: width .3s; }

/* Toast */
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  background: var(--c-ink); color: #fff; padding: 10px 16px; border-radius: 24px;
  font-size: 13px; box-shadow: var(--shadow-md); z-index: 100;
  animation: toastin .2s; max-width: 90vw; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* Modal */
.modal-mask { position: fixed; inset: 0; background: rgba(26,36,56,.4); z-index: 200;
  display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: #fff; border-radius: var(--radius); padding: 20px; max-width: 500px;
  width: 100%; max-height: 80vh; overflow-y: auto; box-shadow: var(--shadow-md); }
.modal h3 { font-size: 18px; margin-bottom: 12px; color: var(--c-primary); }

/* Admin */
.admin-tab { display: flex; gap: 4px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
.admin-tab button { padding: 8px 14px; border-radius: 16px; background: var(--c-surface-2);
  font-size: 13px; color: var(--c-ink-2); white-space: nowrap; }
.admin-tab button.active { background: var(--c-primary); color: #fff; }
.dash-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
.dash-item { padding: 12px; border-radius: var(--radius-sm); background: var(--c-surface); border: 1px solid var(--c-line); }
.dash-item .k { font-size: 11px; color: var(--c-muted); }
.dash-item .v { font-size: 20px; font-weight: 700; }
.dash-item .v.big { font-size: 24px; }

.q-list-item { padding: 10px; border-radius: var(--radius-sm); background: var(--c-surface);
  border: 1px solid var(--c-line); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
.q-list-item .qid { font-family: ui-monospace, monospace; font-size: 12px; color: var(--c-muted); }
.q-list-item .qtitle { font-size: 13px; }
.state-badge { padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 700; }
.state-badge.published { background: #eaf3ee; color: var(--c-ok); }
.state-badge.review { background: #fbf1e5; color: var(--c-warn); }
.state-badge.error { background: #f5e6e6; color: var(--c-err); }
.state-badge.draft { background: var(--c-surface-2); color: var(--c-muted); }

/* Confidence, verdict etc */
.chip { display: inline-block; padding: 3px 10px; border-radius: 12px; background: var(--c-surface-2);
  font-size: 11px; color: var(--c-ink-2); margin-right: 4px; }
.chip.on { background: var(--c-primary); color: #fff; }

hr.sep { border: 0; height: 1px; background: var(--c-line); margin: 16px 0; }

@media (min-width: 720px) {
  main { padding: 24px; }
  .card { padding: 20px; }
  .card-face { width: 52px; height: 72px; font-size: 22px; }
}
</style>
</head>
<body>
<div id="app">
  <header class="appbar">
    <div class="brand">♠ ポーカースキル上達ドリル</div>
    <button class="menu-btn" onclick="location.reload()">↻</button>
  </header>
  <main id="main">
    <div style="padding:20px;text-align:center;color:#8892a4">読み込み中...</div>
  </main>
  <nav class="bottom"></nav>
</div>
<script>
// グローバルエラーハンドラ: エラーとPromise rejectionを必ず画面に表示
function __showBootError(title, detail) {
  var m = document.getElementById("main");
  if (!m) return;
  m.innerHTML = '<div style="padding:20px;color:#a83d3d;background:#fff">' +
    '<h3 style="margin-bottom:8px">' + title + '</h3>' +
    '<pre style="font-size:11px;white-space:pre-wrap;background:#f5f5f5;padding:8px;border-radius:6px;overflow:auto;max-height:280px">' +
    detail + '</pre>' +
    '<button id="__reloadBtn" style="padding:12px 24px;background:#1e3a5f;color:#fff;border:0;border-radius:8px;font-size:15px;margin-top:12px">再読み込み</button>' +
    '<button id="__resetBtn" style="padding:12px 24px;background:#b06a2d;color:#fff;border:0;border-radius:8px;font-size:15px;margin-top:12px;margin-left:8px">データリセット</button>' +
    '</div>';
  var reloadBtn = document.getElementById("__reloadBtn");
  if (reloadBtn) reloadBtn.addEventListener("click", function(){ location.reload(); });
  var resetBtn = document.getElementById("__resetBtn");
  if (resetBtn) resetBtn.addEventListener("click", function(){
    try {
      var keys = Object.keys(localStorage);
      for (var i=0;i<keys.length;i++) if (keys[i].indexOf("poker_drill") === 0) localStorage.removeItem(keys[i]);
      alert("リセット完了");
      location.reload();
    } catch(e) {}
  });
}
window.addEventListener("error", function(e){
  __showBootError("スクリプトエラー", (e.message || "unknown") + '\n' + (e.filename || "") + ':' + (e.lineno || 0) + ':' + (e.colno || 0));
});
window.addEventListener("unhandledrejection", function(e){
  var reason = e.reason;
  var msg = reason && reason.message ? reason.message : String(reason);
  var stack = reason && reason.stack ? reason.stack : "";
  __showBootError("非同期エラー", msg + '\n' + stack);
});
// タイムアウト: 10秒以内に読み込み完了しなければ強制エラー表示
setTimeout(function(){
  var m = document.getElementById("main");
  if (m && m.innerHTML.indexOf("読み込み中") !== -1) {

<script>// 永続レイヤ - IndexedDB + localStorage + メモリの3段階フォールバック
// iOS Safari/プライベートブラウズ/file://など、環境依存の失敗でもアプリを起動させる
window.DB = (function () {
  var NAME = "poker_drill_v1";
  var VERSION = 1;
  var STORES = [
    "User","UserProfile","LearningGoal","SkillCategory","SkillNode","UserSkillMastery",
    "Question","QuestionChoice","QuestionExplanation","QuestionVisualData",
    "Attempt","AttemptDetail","ConfidenceAnswer",
    "Leak","UserLeak","ReviewSchedule",
    "DailyDrill","DailyDrillQuestion","OpponentProfile","AppSettings","ContentValidationLog"
  ];
  var _db = null;
  var _mode = "unknown"; // "idb" | "ls" | "mem"
  var _mem = {}; // メモリ内ストア: {storeName: {id: obj}}

  function _initMem() {
    for (var i = 0; i < STORES.length; i++) _mem[STORES[i]] = {};
  }

  function _lsKey(store) { return NAME + "::" + store; }

  function _lsLoad() {
    _initMem();
    try {
      for (var i = 0; i < STORES.length; i++) {
        var key = _lsKey(STORES[i]);
        var raw = localStorage.getItem(key);
        if (raw) {
          var arr = JSON.parse(raw);
          for (var j = 0; j < arr.length; j++) {
            if (arr[j] && arr[j].id !== undefined) _mem[STORES[i]][arr[j].id] = arr[j];
          }
        }
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  function _lsSave(store) {
    try {
      var arr = [];
      var obj = _mem[store] || {};
      for (var k in obj) if (obj.hasOwnProperty(k)) arr.push(obj[k]);
      localStorage.setItem(_lsKey(store), JSON.stringify(arr));
      return true;
    } catch (e) {
      return false;
    }
  }

  // タイムアウト付きIndexedDBオープン: 5秒で諦めてフォールバック
  function _openIDB() {
    return new Promise(function (res, rej) {
      var settled = false;
      var timer = setTimeout(function () {
        if (!settled) { settled = true; rej(new Error("IndexedDB timeout (5s)")); }
      }, 5000);
      try {
        if (typeof indexedDB === "undefined" || !indexedDB) {
          clearTimeout(timer);
          return rej(new Error("indexedDB not available"));
        }
        var req = indexedDB.open(NAME, VERSION);
        req.onupgradeneeded = function (e) {
          try {
            var db = e.target.result;
            for (var i = 0; i < STORES.length; i++) {
              var name = STORES[i];
              if (!db.objectStoreNames.contains(name)) {
                var store = db.createObjectStore(name, { keyPath: "id" });
                if (name === "Question") {
                  store.createIndex("category", "category");
                  store.createIndex("level", "level");
                  store.createIndex("status", "status");
                }
                if (name === "Attempt") {
                  store.createIndex("userId", "userId");
                  store.createIndex("questionId", "questionId");
                  store.createIndex("createdAt", "createdAt");
                }
                if (name === "ReviewSchedule") {
                  store.createIndex("userId", "userId");
                  store.createIndex("dueAt", "dueAt");
                }
                if (name === "UserSkillMastery") store.createIndex("userId", "userId");
                if (name === "UserLeak") {
                  store.createIndex("userId", "userId");
                  store.createIndex("type", "type");
                }
              }
            }
          } catch (upErr) {
            if (!settled) { settled = true; clearTimeout(timer); rej(upErr); }
          }
        };
        req.onsuccess = function (e) {
          if (!settled) { settled = true; clearTimeout(timer); _db = e.target.result; res(_db); }
        };
        req.onerror = function (e) {
          if (!settled) { settled = true; clearTimeout(timer); rej(new Error("indexedDB error: " + (e.target.error ? e.target.error.message : "unknown"))); }
        };
        req.onblocked = function () {
          if (!settled) { settled = true; clearTimeout(timer); rej(new Error("indexedDB blocked")); }
        };
      } catch (syncErr) {
        clearTimeout(timer);
        rej(syncErr);
      }
    });
  }

  function open() {
    return _openIDB().then(function () {
      _mode = "idb";
      return _mode;
    }).catch(function (idbErr) {
      // IndexedDB失敗 → localStorage/メモリへフォールバック
      console.warn("[DB] IndexedDB unavailable, falling back:", idbErr && idbErr.message);
      var lsOk = false;
      try {
        localStorage.setItem("__test__", "1");
        localStorage.removeItem("__test__");
        lsOk = true;
      } catch (e) {}
      if (lsOk) {
        _lsLoad();
        _mode = "ls";
      } else {
        _initMem();
        _mode = "mem";
      }
      return _mode;
    });
  }

  function getMode() { return _mode; }

  function _idbTx(store, mode) { return _db.transaction(store, mode || "readonly").objectStore(store); }

  function put(store, obj) {
    if (_mode === "idb") {
      return new Promise(function (res, rej) {
        try {
          var r = _idbTx(store, "readwrite").put(obj);
          r.onsuccess = function () { res(r.result); };
          r.onerror = function () { rej(r.error); };
        } catch (e) { rej(e); }
      });
    }
    if (!_mem[store]) _mem[store] = {};
    _mem[store][obj.id] = obj;
    if (_mode === "ls") _lsSave(store);
    return Promise.resolve(obj.id);
  }

  function get(store, id) {
    if (_mode === "idb") {
      return new Promise(function (res, rej) {
        try {
          var r = _idbTx(store).get(id);
          r.onsuccess = function () { res(r.result); };
          r.onerror = function () { rej(r.error); };
        } catch (e) { rej(e); }
      });
    }
    return Promise.resolve((_mem[store] && _mem[store][id]) || undefined);
  }

  function all(store) {
    if (_mode === "idb") {
      return new Promise(function (res, rej) {
        try {
          var r = _idbTx(store).getAll();
          r.onsuccess = function () { res(r.result || []); };
          r.onerror = function () { rej(r.error); };
        } catch (e) { rej(e); }
      });
    }
    var out = [];
    var obj = _mem[store] || {};
    for (var k in obj) if (obj.hasOwnProperty(k)) out.push(obj[k]);
    return Promise.resolve(out);
  }

  function del(store, id) {
    if (_mode === "idb") {
      return new Promise(function (res, rej) {
        try {
          var r = _idbTx(store, "readwrite").delete(id);
          r.onsuccess = function () { res(); };
          r.onerror = function () { rej(r.error); };
        } catch (e) { rej(e); }
      });
    }
    if (_mem[store]) delete _mem[store][id];
    if (_mode === "ls") _lsSave(store);
    return Promise.resolve();
  }

  function clearStore(store) {
    if (_mode === "idb") {
      return new Promise(function (res, rej) {
        try {
          var r = _idbTx(store, "readwrite").clear();
          r.onsuccess = function () { res(); };
          r.onerror = function () { rej(r.error); };
        } catch (e) { rej(e); }
      });
    }
    _mem[store] = {};
    if (_mode === "ls") _lsSave(store);
    return Promise.resolve();
  }

  function query(store, indexName, value) {
    if (_mode === "idb") {
      return new Promise(function (res, rej) {
        try {
          var s = _idbTx(store);
          var idx = indexName ? s.index(indexName) : s;
          var r = idx.getAll(value);
          r.onsuccess = function () { res(r.result || []); };
          r.onerror = function () { rej(r.error); };
        } catch (e) { rej(e); }
      });
    }
    // ローカルではインデックスを線形フィルタで代替
    return all(store).then(function (arr) {
      if (!indexName) return arr;
      return arr.filter(function (o) { return o[indexName] === value; });
    });
  }

  function exportAll() {
    var data = {};
    var chain = Promise.resolve();
    STORES.forEach(function (s) {
      chain = chain.then(function () {
        return all(s).then(function (arr) { data[s] = arr; });
      });
    });
    return chain.then(function () {
      data._exportedAt = new Date().toISOString();
      data._version = VERSION;
      data._mode = _mode;
      return data;
    });
  }

  function importAll(data) {
    var chain = Promise.resolve();
    STORES.forEach(function (s) {
      if (!data[s]) return;
      chain = chain.then(function () { return clearStore(s); });
      data[s].forEach(function (item) {
        chain = chain.then(function () { return put(s, item); });
      });
    });
    return chain;
  }

  return {
    open: open, put: put, get: get, all: all, del: del,
    clearStore: clearStore, query: query,
    exportAll: exportAll, importAll: importAll,
    STORES: STORES, getMode: getMode
  };
})();
</script>

<script>// 視覚コンポーネント — 俯瞰テーブル、カード、ポット、アクション履歴、比較図、ICM天秤
window.VIS = (function () {
  const POS_ORDER_9 = ["UTG","UTG+1","MP","LJ","HJ","CO","BTN","SB","BB"];
  const POS_ORDER_6 = ["UTG","MP","CO","BTN","SB","BB"];
  const POS_TYPE = { UTG:"早い", "UTG+1":"早い", MP:"中間", LJ:"中間", HJ:"中間", CO:"遅い", BTN:"遅い", SB:"ブラインド", BB:"ブラインド" };

  // 俯瞰テーブルSVG生成
  function renderTable(q, opts={}) {
    const seats = q.tableSize === 6 ? POS_ORDER_6 : POS_ORDER_9;
    const cx = 220, cy = 150, rx = 175, ry = 90;
    const foldedSet = new Set();
    const actedSet = new Set();
    let currentActor = q.heroPosition;
    (q.prefloAction || []).forEach(a => {
      if (a.action === "fold") foldedSet.add(a.pos);
      else actedSet.add(a.pos);
    });
    const nodes = seats.map((pos, i) => {
      const angle = (Math.PI * 2 * i / seats.length) + Math.PI/2;
      const x = cx + rx * Math.cos(angle);
      const y = cy + ry * Math.sin(angle);
      let cls = "seat-active";
      if (pos === q.heroPosition) cls = "seat-hero";
      else if (foldedSet.has(pos)) cls = "seat-folded";
      else if (actedSet.has(pos)) cls = "seat-actioned";
      const stack = (q.stacks && q.stacks[pos]) || null;
      const bb = q.blinds ? q.blinds.bb : 100;
      const bbCount = stack ? Math.round(stack / bb) : null;
      const isHero = pos === q.heroPosition;
      return { pos, x, y, cls, bbCount, isHero, ptype: POS_TYPE[pos] };
    });
    const potBB = q.blinds ? (q.pot / q.blinds.bb).toFixed(1) : q.pot;
    return `
    <svg class="table-svg" viewBox="0 0 440 300" xmlns="http://www.w3.org/2000/svg" aria-label="ポーカーテーブル" preserveAspectRatio="xMidYMid meet">
      <ellipse cx="${cx}" cy="${cy}" rx="150" ry="70" fill="#e6ede3" stroke="#98a892" stroke-width="2"/>
      <ellipse cx="${cx}" cy="${cy}" rx="140" ry="62" fill="#f2f0e6" stroke="none"/>
      <circle class="pot-chip" cx="${cx}" cy="${cy-4}" r="10"/>
      <circle cx="${cx}" cy="${cy-4}" r="6" fill="#fff" stroke="#b8875a" stroke-width="1.5"/>
      <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="11" font-weight="700" fill="#1a2438">${potBB}BB</text>
      <text x="${cx}" y="${cy+28}" text-anchor="middle" font-size="9" fill="#8892a4">POT</text>
      ${nodes.map(n => `
        <g transform="translate(${n.x},${n.y})">
          <circle r="22" class="${n.cls}" stroke-width="2"/>
          <text y="4" text-anchor="middle" font-size="10" font-weight="700"
            fill="${n.isHero ? '#fff' : '#1a2438'}">${n.pos}</text>
          ${n.bbCount !== null ? `<text y="35" text-anchor="middle" font-size="9" fill="#4b5468">${n.bbCount}BB</text>` : ''}
          ${n.isHero ? `<rect x="-22" y="-42" width="44" height="14" rx="7" fill="#b8875a"/><text y="-32" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">▼ YOU</text>` : ''}
        </g>`).join('')}
    </svg>`;
  }

  // カード表示
  function renderCard(card, opts={}) {
    if (!card) return '<span class="card-face card-back">?</span>';
    const rank = card[0];
    const suit = card[1];
    const suitChar = { s:"♠", h:"♥", d:"♦", c:"♣" }[suit];
    const size = opts.lg ? "lg" : "";
    const twoColor = opts.twoColor ? "two-color" : "";
    return `<span class="card-face ${size} ${suit} ${twoColor}">${rank}<span class="suit">${suitChar}</span></span>`;
  }
  function renderCards(cards, opts={}) {
    return cards.map(c => renderCard(c, opts)).join('');
  }

  // スタックゲージ
  function renderStackGauge(bb) {
    let cls = "";
    let pct = Math.min(100, (bb / 100) * 100);
    if (bb < 15) cls = "short";
    else if (bb < 30) cls = "mid";
    return `
      <div class="stack-gauge ${cls}">
        <div class="fill" style="width:${pct}%"></div>
      </div>`;
  }

  // アクション履歴タイムライン
  function renderTimeline(q) {
    const acts = q.prefloAction || [];
    const streets = { preflop: [], flop: [], turn: [], river: [] };
    // 現状ではpreflopActionのみを想定。ボード枚数からストリート判別
    streets.preflop = acts;
    const board = q.board || [];
    let out = '<div class="timeline">';
    out += '<div class="street">PREFLOP</div>';
    if (streets.preflop.length === 0) {
      out += '<div class="step"><span class="pos">-</span> アクションなし</div>';
    } else {
      streets.preflop.forEach(a => {
        const isFold = a.action === "fold";
        const cls = isFold ? "folded" : "";
        const amtTxt = a.amount ? ` ${a.amount}` : '';
        const actionJP = { fold:"フォールド", call:"コール", raise:"レイズ", check:"チェック", bet:"ベット", "all-in":"オールイン" }[a.action] || a.action;
        out += `<div class="step ${cls}"><span class="pos">${a.pos}</span>${actionJP}${amtTxt}</div>`;
      });
    }
    if (board.length >= 3) {
      out += `<div class="street">FLOP ${board.slice(0,3).map(c=>VIS.renderCard(c,{})).join('')}</div>`;
    }
    if (board.length >= 4) {
      out += `<div class="street">TURN ${VIS.renderCard(board[3])}</div>`;
    }
    if (board.length >= 5) {
      out += `<div class="street">RIVER ${VIS.renderCard(board[4])}</div>`;
    }
    out += `<div class="step hero"><span class="pos">${q.heroPosition}</span><b>あなたの判断</b></div>`;
    out += '</div>';
    return out;
  }

  // ポット枠
  function renderPot(q) {
    const bb = q.blinds ? q.blinds.bb : 100;
    const potBB = (q.pot / bb).toFixed(1);
    return `<div class="pot-box">
      <div class="chip"></div>
      <div><div class="pot-v">${q.pot}</div><div style="font-size:11px;color:var(--c-muted)">= ${potBB}BB</div></div>
      <div class="pot-l">POT</div>
    </div>`;
  }

  // レンジ優位/ナッツ優位 比較
  function renderAdvantageCompare(rangeAdv, nutAdv) {
    const label = { open_side:"オープン側", call_side:"コール側", even:"拮抗" };
    function bar(who) {
      if (who === "open_side") return `<div class="bar"><div class="fill" style="width:72%"></div></div>`;
      if (who === "call_side") return `<div class="bar"><div class="fill" style="width:30%"></div></div>`;
      return `<div class="bar"><div class="fill" style="width:50%"></div></div>`;
    }
    return `
      <div class="compare-bar">
        <div><div class="lbl">レンジ優位</div>${bar(rangeAdv)}</div>
        <div class="name">vs</div>
        <div><div class="lbl">ナッツ優位</div>${bar(nutAdv)}</div>
      </div>
      <div style="font-size:12px;color:var(--c-muted);margin-top:4px">
        ● レンジ優位＝<b>${label[rangeAdv] || rangeAdv || '情報なし'}</b>／
        ● ナッツ優位＝<b>${label[nutAdv] || nutAdv || '情報なし'}</b>
      </div>`;
  }

  // ICM天秤（残人数・カバー関係）
  function renderICM(q) {
    if (q.category !== "icm") return '';
    return `<div class="card" style="background:linear-gradient(135deg,#fbf1e5,#f7f4ec)">
      <h3>⚖ ICM圧力の視覚化</h3>
      <div style="font-size:12px;color:var(--c-ink-2)">
        バブル/FT局面では、飛んだ場合の損失 &gt; ダブルアップ時の利益。<br>
        <b>負けたときの重み</b>が大きい局面では、チップEVでなくマネーEVで判断します。
      </div>
      <svg viewBox="0 0 300 90" style="width:100%;max-width:300px;display:block;margin:8px auto">
        <line x1="150" y1="10" x2="150" y2="70" stroke="#1a2438" stroke-width="2"/>
        <line x1="60" y1="70" x2="240" y2="70" stroke="#1a2438" stroke-width="3"/>
        <rect x="40" y="55" width="60" height="20" fill="#a83d3d" stroke="#1a2438"/>
        <text x="70" y="70" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">損失重</text>
        <rect x="200" y="60" width="50" height="12" fill="#3d7a56" stroke="#1a2438"/>
        <text x="225" y="70" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">利益</text>
        <circle cx="150" cy="72" r="4" fill="#b8875a"/>
      </svg>
    </div>`;
  }

  return {
    renderTable, renderCard, renderCards, renderStackGauge,
    renderTimeline, renderPot, renderAdvantageCompare, renderICM
  };
})();
</script>
<script>// ドメインロジック — 判定、習熟度、SRS、リーク、検証パイプライン
window.LOGIC = (function () {

  // 回答判定 (7区分)
  function evaluate(question, answer) {
    const correctAction = question.correctAction;
    const acceptable = question.acceptableActions || [correctAction];
    const isActionCorrect = answer.action === correctAction;
    const isActionAcceptable = acceptable.includes(answer.action);
    const hasSizeCheck = question.correctSize && answer.size;
    const isSizeCorrect = !hasSizeCheck || answer.size === question.correctSize;
    const isReasonCorrect = !answer.reason || answer.reason === "correct";

    if (isActionCorrect && isSizeCorrect && isReasonCorrect) {
      return { verdict: "correct", label: "完全正解", score: 1.0, cls: "correct" };
    }
    if (isActionCorrect && !isSizeCorrect) {
      return { verdict: "action_ok_size_wrong", label: "アクションは正しいがサイズが違う", score: 0.7, cls: "partial" };
    }
    if (isActionCorrect && !isReasonCorrect) {
      return { verdict: "action_ok_reason_wrong", label: "結論は正しいが理由が違う", score: 0.75, cls: "partial" };
    }
    if (isActionAcceptable && !isActionCorrect) {
      return { verdict: "mix_ok", label: "ミックス戦略として許容", score: 0.85, cls: "mix" };
    }
    if (isActionCorrect) {
      return { verdict: "mostly_correct", label: "概ね正解", score: 0.9, cls: "correct" };
    }
    return { verdict: "wrong", label: "不正解", score: 0.0, cls: "wrong" };
  }

  // 習熟度更新 (加重平均)
  // 重み: アクション正解率35% + 理由20% + 条件変更15% + 復習15% + サイズ10% + 自信度5%
  function updateMastery(prev, evalResult, isConditionVariation=false, isReview=false, confidenceMatch=true) {
    const w = { action: 0.35, reason: 0.20, cond: 0.15, review: 0.15, size: 0.10, conf: 0.05 };
    const score100 = evalResult.score * 100;
    const partial = {
      action: evalResult.score >= 0.85 ? score100 : (evalResult.score >= 0.7 ? 70 : 0),
      reason: evalResult.verdict === "action_ok_reason_wrong" ? 30 : (evalResult.score >= 0.85 ? 90 : 40),
      cond: isConditionVariation ? score100 : (prev.cond ?? 50),
      review: isReview ? score100 : (prev.review ?? 50),
      size: evalResult.verdict === "action_ok_size_wrong" ? 30 : (evalResult.score >= 0.85 ? 90 : 50),
      conf: confidenceMatch ? 85 : 40
    };
    const newVal = partial.action*w.action + partial.reason*w.reason + partial.cond*w.cond
      + partial.review*w.review + partial.size*w.size + partial.conf*w.conf;
    // 過去との加重平均 (新規重み 0.35)
    const prevVal = prev.value ?? 30;
    const merged = Math.round(prevVal * 0.65 + newVal * 0.35);
    return { ...partial, value: Math.max(0, Math.min(100, merged)) };
  }
  function masteryLabel(v) {
    if (v < 30) return { label:"未習得", cls:"draft" };
    if (v < 60) return { label:"学習中", cls:"review" };
    if (v < 80) return { label:"実戦練習中", cls:"review" };
    if (v < 95) return { label:"習得", cls:"published" };
    return { label:"定着", cls:"published" };
  }

  // SRS 間隔: 不正解直後→翌日→3日→7日→14日→30日
  const SRS_INTERVALS_HOURS = [0, 24, 72, 168, 336, 720];
  function nextReview(prevIntervalIdx, evalResult, confidence, responseTimeMs) {
    let idx = prevIntervalIdx ?? 0;
    if (evalResult.score >= 0.85) idx = Math.min(SRS_INTERVALS_HOURS.length - 1, idx + 1);
    else if (evalResult.score >= 0.5) idx = Math.max(0, idx);
    else idx = Math.max(0, idx - 2);
    // 自信度と実力のズレで調整
    if (evalResult.score >= 0.85 && confidence === "guess") idx = Math.max(0, idx - 1);
    if (evalResult.score < 0.5 && confidence === "high") idx = Math.max(0, idx - 1);
    const hours = SRS_INTERVALS_HOURS[idx];
    return { intervalIdx: idx, dueAt: Date.now() + hours * 3600 * 1000 };
  }

  // リーク検出 — 回答パターンからリーク種別を判定
  function detectLeaks(question, answer, evalResult) {
    const leaks = [];
    const q = question;
    if (evalResult.score >= 0.85) return leaks;
    // BB守備関連
    if (q.decisionPoint === "bb_defense" && answer.action === "Fold") leaks.push("BBを守らなさすぎる");
    if (q.decisionPoint === "bb_defense" && answer.action === "Call" && q.correctAction === "Fold") leaks.push("BBを守りすぎる");
    // 3ベット関連
    if (q.decisionPoint === "vs_open" && answer.action === "Raise" && q.correctAction !== "Raise") leaks.push("3ベットブラフが多すぎる");
    if (q.skillTags && q.skillTags.includes("3bet") && answer.action !== "Raise" && q.correctAction === "Raise") leaks.push("3ベットがバリューに偏る");
    // ショートスタック
    if (q.effectiveStack && q.blinds && q.effectiveStack / q.blinds.bb < 15 && answer.action === "Call" && q.correctAction === "All-in") leaks.push("ショートスタックでコールを残しすぎる");
    // フロップCB
    if (q.decisionPoint === "flop" && answer.action === "Bet" && q.correctAction === "Check") leaks.push("フロップで自動CBする");
    // リバー
    if (q.decisionPoint === "river" && answer.action === "Fold" && q.correctAction === "Call") leaks.push("リバーで降りすぎる");
    if (q.decisionPoint === "river" && answer.action === "Call" && q.correctAction === "Fold") leaks.push("リバーでコールしすぎる");
    // 薄いバリュー逃し
    if (q.skillTags && q.skillTags.includes("thin_value") && answer.action !== "Bet") leaks.push("薄いバリューを逃す");
    // ターンで諦めすぎ
    if (q.decisionPoint === "turn" && answer.action === "Check" && q.correctAction === "Bet" && q.skillTags && q.skillTags.some(t=>t.includes("bluff"))) leaks.push("ターンでブラフを諦めすぎる");
    // サイズ違い
    if (evalResult.verdict === "action_ok_size_wrong") leaks.push("サイズの理由を説明できない");
    // ICM関連
    if (q.category === "icm" && answer.action !== "Fold" && q.correctAction === "Fold") leaks.push("ICM下でコールしすぎる");
    // マルチウェイ
    if (q.skillTags && q.skillTags.includes("multiway") && answer.action === "Bet" && q.correctAction !== "Bet") leaks.push("マルチウェイでベットしすぎる");
    // レンジ/ナッツ混同
    if (q.skillTags && (q.skillTags.includes("range_advantage") || q.skillTags.includes("nut_advantage")) && evalResult.verdict === "action_ok_size_wrong") leaks.push("レンジ優位とナッツ優位を混同する");
    // 大きい/小さいベットフォールド
    if (q.decisionPoint === "river" && answer.action === "Fold") leaks.push("大きいベットに降りすぎる");

    return [...new Set(leaks)];
  }

  // 問題データの検証パイプライン
  function validateQuestion(q) {
    const errors = [];
    // カード重複検証
    const allCards = [...(q.heroHand||[]), ...(q.board||[])];
    const cardSet = new Set(allCards);
    if (cardSet.size !== allCards.length) errors.push("カード重複が検出されました");
    // カード形式検証
    const cardPattern = /^[2-9TJQKA][shdc]$/;
    for (const c of allCards) {
      if (!cardPattern.test(c)) errors.push(`不正なカード表記: ${c}`);
    }
    // ポット・スタック存在
    if (typeof q.pot !== "number" || q.pot < 0) errors.push("ポット値が不正");
    if (typeof q.effectiveStack !== "number" || q.effectiveStack <= 0) errors.push("有効スタックが不正");
    // ブラインド
    if (!q.blinds || typeof q.blinds.bb !== "number") errors.push("ブラインド設定が不正");
    // ポジション
    const validPos = ["UTG","UTG+1","MP","LJ","HJ","CO","BTN","SB","BB"];
    if (!validPos.includes(q.heroPosition)) errors.push("Heroポジションが不正");
    // アクション順検証 (登録順にfoldedプレイヤーが再登場していないか)
    const actedSequence = (q.prefloAction || []).map(a => a.pos);
    const foldedSet = new Set();
    for (const a of q.prefloAction || []) {
      if (foldedSet.has(a.pos) && a.action !== "fold") errors.push(`アクション順エラー: ${a.pos} は既にフォールド済み`);
      if (a.action === "fold") foldedSet.add(a.pos);
    }
    // 選択肢と正解の整合性
    if (!q.actions || !q.actions.includes(q.correctAction)) errors.push("正解アクションが選択肢に含まれていない");
    // サイズ整合性
    if (q.correctSize && q.sizes && !q.sizes.find(s => s.label === q.correctSize)) errors.push("正解サイズが選択肢に含まれていない");
    // 解説必須項目
    if (!q.beginnerExplain) errors.push("初心者向け解説が未設定");
    if (!q.memoryLine) errors.push("実戦で覚える一言が未設定");
    if (!q.sourceType) errors.push("戦略情報の根拠分類が未設定");
    // 26項目チェック
    const required26 = ["id","category","skillTags","level","difficulty","gameFormat","tableSize","heroPosition","blinds","effectiveStack","stacks","prefloAction","board","pot","decisionPoint","actions","correctAction","beginnerExplain","advancedExplain","memoryLine","commonMistake","conditionVariation","sourceType","status","validation"];
    for (const k of required26) {
      if (q[k] === undefined || q[k] === null) errors.push(`必須項目未設定: ${k}`);
    }
    return { ok: errors.length === 0, errors };
  }

  // 全問題を検証し、重複IDも検出
  function validateAll(questions) {
    const report = { total: questions.length, ok: 0, errors: [], duplicates: [] };
    const idSet = new Set();
    for (const q of questions) {
      if (idSet.has(q.id)) report.duplicates.push(q.id);
      idSet.add(q.id);
      const v = validateQuestion(q);
      if (v.ok) report.ok++;
      else report.errors.push({ id: q.id, errors: v.errors });
    }
    return report;
  }

  // ドリル5問セット選定
  async function pickDailyDrill(userId, questions, srsList, masteryList) {
    const now = Date.now();
    const dueReview = srsList.filter(s => s.userId === userId && s.dueAt <= now).map(s => s.questionId);
    const wrongIds = srsList.filter(s => s.userId === userId && s.lastScore < 0.85).map(s => s.questionId);
    const published = questions.filter(q => q.status === "published");

    const pool = {
      focus: published.filter(q => q.level <= 2),
      wrong: published.filter(q => wrongIds.includes(q.id)),
      review: published.filter(q => dueReview.includes(q.id)),
      practical: published.filter(q => q.level >= 2)
    };
    const shuffle = arr => [...arr].sort(() => Math.random() - .5);
    const pick = (arr, n) => shuffle(arr).slice(0, n);
    const chosen = [];
    const used = new Set();
    function add(list, n) {
      for (const q of list) {
        if (chosen.length >= 5) break;
        if (!used.has(q.id)) { chosen.push(q); used.add(q.id); if (--n<=0) break; }
      }
    }
    add(pick(pool.focus, 2), 2);
    add(pick(pool.wrong, 1), 1);
    add(pick(pool.review, 1), 1);
    add(pick(pool.practical, 1), 1);
    // 足りなければpublishedから補完
    if (chosen.length < 5) add(pick(published, 5), 5 - chosen.length);
    return chosen;
  }

  return {
    evaluate, updateMastery, masteryLabel, nextReview, detectLeaks,
    validateQuestion, validateAll, pickDailyDrill,
    SRS_INTERVALS_HOURS
  };
})();
</script>
<script>// メインアプリ v2 - 徹底的に単純化し、エラー耐性を高めた版
window.APP = (function () {
  const state = {
    userId: null,
    user: null,
    view: "home",
    drillQueue: [],
    drillIndex: 0,
    currentAnswer: {},
    settings: { fourColorDeck: false },
    onboarding: null
  };

  const $ = sel => document.querySelector(sel);
  const $$ = sel => document.querySelectorAll(sel);

  function toast(msg) {
    try {
      const t = document.createElement("div");
      t.className = "toast"; t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2400);
    } catch (e) { console.log("toast:", msg); }
  }

  function showError(msg, detail) {
    const main = $("#main");
    if (main) {
      main.innerHTML = `<div class="card" style="border-left:4px solid var(--c-err)">
        <h3 style="color:var(--c-err)">エラーが発生しました</h3>
        <div style="font-size:13px;color:var(--c-ink-2);margin:8px 0">${msg}</div>
        ${detail ? `<pre style="font-size:11px;background:var(--c-surface-2);padding:8px;border-radius:6px;overflow:auto;max-height:200px">${detail}</pre>` : ''}
        <button class="btn primary block" onclick="location.reload()">再読み込み</button>
      </div>`;
    }
    console.error(msg, detail);
  }

  async function init() {
    var main = document.getElementById("main");
    try {
      if (main) main.innerHTML = '<div style="padding:20px;text-align:center;color:#8892a4">初期化中... (DB接続)</div>';
      var mode = await DB.open();
      if (main) main.innerHTML = '<div style="padding:20px;text-align:center;color:#8892a4">初期化中... (問題ロード)</div>';
      var existing = await DB.all("Question");
      if (existing.length === 0) {
        var qs = window.INITIAL_QUESTIONS || [];
        for (var i = 0; i < qs.length; i++) {
          try { await DB.put("Question", qs[i]); } catch (putErr) { console.warn("put fail", qs[i].id, putErr); }
        }
      }
      if (main) main.innerHTML = '<div style="padding:20px;text-align:center;color:#8892a4">初期化中... (ユーザー確認)</div>';
      var users = await DB.all("User");
      // DBモードを小さく表示(デバッグ用)
      var brand = document.querySelector(".appbar .brand");
      if (brand && mode && mode !== "idb") {
        brand.innerHTML = '♠ ポーカースキル上達ドリル <span style="font-size:10px;color:#b06a2d;font-weight:400">(' + mode + ')</span>';
      }
      if (users.length === 0) {
        renderOnboarding();
      } else {
        state.user = users[0];
        state.userId = users[0].id;
        var s = await DB.all("AppSettings");
        if (s[0]) state.settings = Object.assign(state.settings, s[0]);
        renderHome();
      }
    } catch (e) {
      showError("初期化エラー: " + (e && e.message ? e.message : String(e)), e && e.stack ? e.stack : "");
    }
  }

  // ========== ONBOARDING (書き直し版) ==========
  function renderOnboarding() {
    const nav = document.querySelector("nav.bottom");
    if (nav) nav.style.display = "none";
    state.onboarding = { step: 0, nickname: "", env: "", goal: "", diagIdx: 0, diagScore: 0, startLevel: 0 };
    obRender();
  }

  function obRender() {
    const ob = state.onboarding;
    if (!ob) return;
    const totalSteps = 5;
    const pct = ((ob.step + 1) / totalSteps) * 100;
    const progressBar = `<div class="ob-progress"><div class="fill" style="width:${pct}%"></div></div>`;

    if (ob.step === 0) obRenderNickname(progressBar);
    else if (ob.step === 1) obRenderEnv(progressBar);
    else if (ob.step === 2) obRenderGoal(progressBar);
    else if (ob.step === 3) obRenderDiag(progressBar);
    else if (ob.step === 4) obRenderResult(progressBar);
  }

  function obRenderNickname(bar) {
    $("#main").innerHTML = `${bar}<div class="ob-step">
      <h2>ようこそ</h2>
      <p>ポーカースキル上達ドリルへようこそ。<br>まずはニックネームを教えてください。</p>
      <input id="ob-nick" type="text" placeholder="例：Yamada" autocomplete="off"/>
      <div style="margin-top:20px">
        <button class="btn primary" id="ob-next-nick">次へ →</button>
      </div>
    </div>`;
    const input = $("#ob-nick");
    const btn = $("#ob-next-nick");
    if (input) setTimeout(() => input.focus(), 100);
    if (btn) btn.addEventListener("click", () => {
      const val = input ? input.value.trim() : "";
      if (!val) { toast("ニックネームを入力してください"); return; }
      state.onboarding.nickname = val;
      state.onboarding.step = 1;
      obRender();
    });
    if (input) input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && btn) btn.click();
    });
  }

  function obRenderEnv(bar) {
    const opts = [
      ["ライブMTT", "live_mtt"], ["オンラインMTT", "online_mtt"],
      ["キャッシュゲーム", "cash"], ["実戦経験が少ない", "beginner"]
    ];
    $("#main").innerHTML = `${bar}<div class="ob-step">
      <h2>主なプレー環境</h2>
      <p>どこで主にプレーしていますか？</p>
      <div class="options">
        ${opts.map(([l, v]) => `<button class="btn ghost ob-opt" data-val="${v}">${l}</button>`).join('')}
      </div>
    </div>`;
    $$(".ob-opt").forEach(b => b.addEventListener("click", () => {
      state.onboarding.env = b.dataset.val;
      state.onboarding.step = 2;
      obRender();
    }));
  }

  function obRenderGoal(bar) {
    const opts = [
      ["初級者を卒業したい", "escape_beginner"],
      ["トーナメントで勝つ判断力", "mtt_win"],
      ["GTOの基礎を理解", "gto_basic"],
      ["ICMを身につける", "icm"],
      ["中級から上級へ", "advance"],
      ["自分のリークを減らす", "reduce_leak"]
    ];
    $("#main").innerHTML = `${bar}<div class="ob-step">
      <h2>目標</h2>
      <p>目指すレベルを選んでください。</p>
      <div class="options">
        ${opts.map(([l, v]) => `<button class="btn ghost ob-opt" data-val="${v}">${l}</button>`).join('')}
      </div>
    </div>`;
    $$(".ob-opt").forEach(b => b.addEventListener("click", () => {
      state.onboarding.goal = b.dataset.val;
      state.onboarding.step = 3;
      obRender();
    }));
  }

  function obRenderDiag(bar) {
    const ob = state.onboarding;
    if (ob.diagIdx >= 10) {
      ob.step = 4;
      obRender();
      return;
    }
    // 診断問題の選定 — INITIAL_QUESTIONS から10問を等間隔で選ぶ
    const questions = window.INITIAL_QUESTIONS || [];
    if (questions.length === 0) {
      showError("問題データが読み込まれていません", "");
      return;
    }
    const idx = Math.floor((ob.diagIdx / 10) * questions.length);
    const q = questions[idx];
    if (!q) {

  // ========== DRILL ==========
  async function startDrill() {
    state.view = "drill";
    try {
      const questions = await DB.all("Question");
      const srs = await DB.query("ReviewSchedule", "userId", state.userId);
      const masteries = await DB.query("UserSkillMastery", "userId", state.userId);
      const queue = await LOGIC.pickDailyDrill(state.userId, questions, srs, masteries);
      if (queue.length === 0) {
        $("#main").innerHTML = `<div class="card"><h3>問題がありません</h3><p>管理画面から問題を追加してください。</p></div>`;
        renderBottomNav();
        return;
      }
      state.drillQueue = queue;
      state.drillIndex = 0;
      renderQuestion();
      renderBottomNav();
    } catch (e) {
      showError("ドリル開始エラー: " + e.message, e.stack);
    }
  }

  function handleAction(action) {
    const q = state.drillQueue[state.drillIndex];
    state.currentAnswer.action = action;
    const needSize = ["Bet", "Raise"].includes(action) && q.sizes && q.sizes.length > 0;
    if (needSize) {
      showSizePanel();
    } else {
      askConfidence();
    }
  }

  function showSizePanel() {
    const q = state.drillQueue[state.drillIndex];
    const panel = $("#action-panel");
    if (!panel) return;
    panel.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h3 style="margin:0">サイズを選択</h3>
        <button class="btn ghost" id="back-to-action" style="min-height:36px;padding:6px 12px;font-size:12px">← 戻る</button>

      <div class="size-grid">
        ${q.sizes.map(s => `<button class="btn ghost size-btn" data-size="${s.label}"><div>${s.label}</div><div class="amt">${s.value}</div></button>`).join('')}

    const q = state.drillQueue[state.drillIndex];
    const panel = $("#action-panel");

    panel.innerHTML = `

      <div class="act-grid">
        ${q.actions.map(a => `<button class="btn ghost act-btn" data-action="${a}">${a}</button>`).join('')}
      </div>`;
    $$(".act-btn").forEach(b => b.addEventListener("click", () => handleAction(b.dataset.action)));

  function askConfidence() {
    const q = state.drillQueue[state.drillIndex];
    const panel = $("#action-panel");
    if (!panel) return;
    const needSize = ["Bet", "Raise"].includes(state.currentAnswer.action) && q.sizes && q.sizes.length > 0;
    panel.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h3 style="margin:0">自信度</h3>
        <button class="btn ghost" id="back-to-prev" style="min-height:36px;padding:6px 12px;font-size:12px">← 戻る</button>
      </div>
      <div style="font-size:12px;color:var(--c-muted);margin-bottom:8px">選択中: <b>${state.currentAnswer.action}${state.currentAnswer.size ? ' (' + state.currentAnswer.size + ')' : ''}</b></div>
      <div class="conf-grid">
        <button class="btn ghost conf-btn" data-conf="high">かなり自信</button>
        <button class="btn ghost conf-btn" data-conf="mid">少し自信</button>
        <button class="btn ghost conf-btn" data-conf="low">迷い</button>
        <button class="btn ghost conf-btn" data-conf="guess">ほぼ勘</button>
      </div>`;
    $$(".conf-btn").forEach(b => b.addEventListener("click", () => {
      state.currentAnswer.confidence = b.dataset.conf;
      submitAnswer();
    }));
    const back = $("#back-to-prev");
    if (back) back.addEventListener("click", () => {
      if (needSize) {
        state.currentAnswer.size = null;
        showSizePanel();
      } else {

        showActionPanel();

    });

  async function submitAnswer() {
    try {
      const q = state.drillQueue[state.drillIndex];
      const ans = state.currentAnswer;
      ans.responseTimeMs = Date.now() - ans.startTime;
      const ev = LOGIC.evaluate(q, ans);

      const att = {
        id: "a_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        userId: state.userId, questionId: q.id, action: ans.action, size: ans.size,
        confidence: ans.confidence, verdict: ev.verdict, score: ev.score,
        responseTimeMs: ans.responseTimeMs, createdAt: Date.now()
      };
      await DB.put("Attempt", att);

      const existingMasteries = await DB.query("UserSkillMastery", "userId", state.userId);
      for (const tag of (q.skillTags || [])) {
        const existing = existingMasteries.find(m => m.tag === tag);
        const prev = existing || { value: 30 };
        const conf = (ev.score >= 0.85 && ans.confidence !== "guess") ||
          (ev.score < 0.5 && ans.confidence === "guess") ||
          (ans.confidence === "mid" || ans.confidence === "low");
        const updated = LOGIC.updateMastery(prev, ev, false, false, conf);
        const rec = Object.assign({
          id: existing ? existing.id : ("m_" + state.userId + "_" + tag),
          userId: state.userId, tag, updatedAt: Date.now()
        }, updated);
        await DB.put("UserSkillMastery", rec);
      }

      const leaks = LOGIC.detectLeaks(q, ans, ev);
      const existingLeaks = await DB.query("UserLeak", "userId", state.userId);
      for (const type of leaks) {
        const existing = existingLeaks.find(l => l.type === type);
        const rec = {
          id: existing ? existing.id : ("l_" + state.userId + "_" + type.replace(/\s/g, "_")),
          userId: state.userId, type,
          count: (existing ? existing.count : 0) + 1,
          lastAt: Date.now(),
          severity: (existing ? existing.count : 0) >= 2 ? "high" : "mid"
        };
        await DB.put("UserLeak", rec);
      }

      const existingSrs = await DB.query("ReviewSchedule", "userId", state.userId);
      const prevSrs = existingSrs.find(s => s.questionId === q.id);
      const srs = LOGIC.nextReview(prevSrs ? prevSrs.intervalIdx : 0, ev, ans.confidence, ans.responseTimeMs);
      const srsRec = {
        id: prevSrs ? prevSrs.id : ("s_" + state.userId + "_" + q.id),
        userId: state.userId, questionId: q.id,
        intervalIdx: srs.intervalIdx, dueAt: srs.dueAt,
        lastScore: ev.score, updatedAt: Date.now()
      };
      await DB.put("ReviewSchedule", srsRec);

      renderExplanation(q, ans, ev);
    } catch (e) {
      showError("回答保存エラー: " + e.message, e.stack);
    }
  }

  function srcBadge(type) {
    const map = {
      "SOLVER-BACKED": ["solver", "SOLVER"],
      "THEORY-BASED": ["theory", "THEORY"],
      "EXPLOIT HYPOTHESIS": ["exploit", "EXPLOIT"],
      "INSUFFICIENT DATA": ["insufficient", "N/A"]
    };
    const arr = map[type] || ["insufficient", "N/A"];
    return `<span class="src-badge ${arr[0]}">${arr[1]}</span>`;
  }

  function renderThoughtSteps(q) {
    const bb = q.blinds ? q.blinds.bb : 100;
    const effBB = q.effectiveStack ? Math.round(q.effectiveStack / bb) : 100;
    const stackDepth = effBB < 15 ? "極浅(オールイン/フォールドが基本)" :
                       effBB < 25 ? "浅い(リジャム圏)" :
                       effBB < 40 ? "中程度(SPRを意識)" :
                       effBB < 100 ? "深め(通常戦略)" : "深い(ポストフロップ勝負)";
    const posType = { "UTG":"最も早い位置(タイトに)", "UTG+1":"早い位置(タイトに)",
                      "MP":"中間位置(標準的に)", "LJ":"中間位置(標準的に)", "HJ":"中間位置(標準的に)",
                      "CO":"遅い位置(広く参加)", "BTN":"最も遅い位置(最も広く)",
                      "SB":"ブラインド(OOPで慎重)", "BB":"ブラインド(価格で守る)" }[q.heroPosition] || "-";
    const boardTags = (q.visualHints && q.visualHints.boardTexture) || [];
    const rangeAdv = (q.visualHints && q.visualHints.rangeAdvantage) || null;
    const nutAdv = (q.visualHints && q.visualHints.nutAdvantage) || null;

    const boardText = q.board && q.board.length > 0
      ? "ボード" + q.board.join(" ") + " は " + (boardTags.length ? boardTags.join("・") : "未分類") +
        "。" + (q.decisionPoint === "flop" ? "フロップでのレンジ衝突(どちらのレンジに何がヒットしやすいか)を確認。" :
               q.decisionPoint === "turn" ? "ターンでレンジがどう変化したか(自分向け・相手向けのカードか)を判定。" :
               q.decisionPoint === "river" ? "リバーで最終的にレンジがどう決着したか。バリュー候補とブラフ候補を列挙。" : "ボードの動きを確認。")
      : "プリフロップなのでボードは未展開。ボード発生後のプレイアビリティ(扫けるボードの多寡)を見越して選択。";

    const rangeText = rangeAdv
      ? "レンジ優位 = " + (rangeAdv === "open_side" ? "オープン側" : rangeAdv === "call_side" ? "コール側" : "拮抗") +
        "。有利な側は小さいサイズで広く、不利な側は控えめに判断。ナッツ優位とも別々に検討。"
      : "自分・相手双方のプリフロップレンジを想像。どちらが平均的に強いか(レンジ優位)、どちらがナッツを多く持つか(ナッツ優位)を區別。";

    const sizeText = q.correctSize
      ? "今回は <b>" + q.correctSize + "</b> が最適。" +
        (nutAdv === "open_side" ? "ナッツ優位もあるためポラライズ寄りも視野。" :
         nutAdv === "call_side" ? "ナッツ優位は相手なので慎重サイズ。" : "サイズの役割(バリュー・プロテクション・ブラフ)を意識。")
      : "サイズはレンジ全体で守れる値を選ぶ。小サイズ=レンジで広く、大サイズ=ポラライズ(ナッツとブラフ)。";

    const icmText = q.category === "icm"
      ? "ICM局面。飛んだ場合の損失 > ダブルアップ時の利益。<b>カバー関係と賞金ジャンプを必ず確認</b>。リスクプレミアムを乗せてタイトに。"
      : (q.gameFormat === "MTT" ? "MTTだがICM影響は現時点で軽微。通常のチップEVで判断可。" : "キャッシュゲームなのでICMは考慮外。純粋なEV最大化で判断。");

    const oppText = (q.category === "exploit" || q.sourceType === "EXPLOIT HYPOTHESIS")
      ? "相手の傾向を最重視。観察サンプル・ショーダウン情報から逆算し、基準線から意図的にズラす。確信度と量の調整を忘れないこと。"
      : "相手は標準的レンジ想定。特別な傾向情報が無ければ基準線で判断。推測プレイは反証情報なしでは潜めない。";

    const tags = q.skillTags || [];
    const important = {
      position: tags.some(function(t){return /position|rfi|open|btn|utg|sb|bb/i.test(t);}) || q.decisionPoint === "preflop_open",
      stack: tags.some(function(t){return /stack|jam|shove|short/i.test(t);}) || effBB < 30,
      range: tags.some(function(t){return /range|advantage/i.test(t);}) || !!rangeAdv,
      board: q.board && q.board.length > 0,
      size: tags.some(function(t){return /sizing|size|overbet|thin_value|polar/i.test(t);}) || !!q.correctSize,
      icm: q.category === "icm" || tags.some(function(t){return /icm|bubble|pay/i.test(t);}),
      opp: q.category === "exploit" || tags.some(function(t){return /exploit|fold_too|call_too/i.test(t);}) || q.sourceType === "EXPLOIT HYPOTHESIS"
    };

    function step(num, name, focused, text) {
      return '<div style="padding:10px 12px;margin:6px 0;border-radius:8px;background:' +
        (focused ? '#fbf1e5' : 'var(--c-surface-2)') + ';border-left:3px solid ' +
        (focused ? 'var(--c-accent)' : 'var(--c-line)') + '">' +
        '<div style="font-weight:700;font-size:13px;color:var(--c-primary);margin-bottom:4px">' +
        (focused ? '◆ ' : (num + '. ')) + name + '</div>' +
        '<div style="font-size:12px;color:var(--c-ink-2);line-height:1.6">' + text + '</div></div>';
    }

    return step(1, "ポジション", important.position,
        q.heroPosition + " = " + posType + "。<br>※ 後ろに残る人数を数え、レンジ幅の妥当性を確認。早い位置でワイドレンジは危険、遅い位置で強すぎるのは機会損失。") +
      step(2, "スタック", important.stack,
        effBB + "BB (" + stackDepth + ")。<br>※ この深さで許される戦略(オールイン/リジャム/通常レイズ)と、ポストフロップのSPRを意識。コミット/非コミットの境界を確認。") +
      step(3, "レンジ", important.range, rangeText + "<br>※ 自分の1手だけを見ないで、入っている全ハンド群で考える。") +
      step(4, "ボード", important.board, boardText) +
      step(5, "サイズ", important.size, sizeText + "<br>※ なぜそのサイズなのか説明できない選択は避ける。") +
      step(6, "ICM", important.icm, icmText) +
      step(7, "相手の傾向", important.opp, oppText);
  }

  // ========== STATS ==========
  async function renderStats() {
    state.view = "stats";
    try {
      const attempts = await DB.query("Attempt", "userId", state.userId);
      const masteries = await DB.query("UserSkillMastery", "userId", state.userId);
      const leaks = await DB.query("UserLeak", "userId", state.userId);
      const srs = await DB.query("ReviewSchedule", "userId", state.userId);
      const dueCount = srs.filter(s => s.dueAt <= Date.now()).length;
      const weekAgo = Date.now() - 7 * 24 * 3600 * 1000;
      const weekAttempts = attempts.filter(a => a.createdAt >= weekAgo);
      const weekCorrect = weekAttempts.filter(a => a.score >= 0.85).length;
      const weekRate = weekAttempts.length ? Math.round(weekCorrect / weekAttempts.length * 100) : 0;
      const avgMastery = masteries.length ? Math.round(masteries.reduce((a, b) => a + b.value, 0) / masteries.length) : 0;
      const mastered = masteries.filter(m => m.value >= 80).length;
      const weakness = masteries.slice().sort((a, b) => a.value - b.value).slice(0, 3);
      const topLeaks = leaks.slice().sort((a, b) => b.count - a.count).slice(0, 5);
      const questions = window.INITIAL_QUESTIONS || [];

      const catStats = {};
      for (const a of attempts) {
        const q = questions.find(x => x.id === a.questionId);
        if (!q) continue;
        catStats[q.category] = catStats[q.category] || { total: 0, correct: 0 };
        catStats[q.category].total++;
        if (a.score >= 0.85) catStats[q.category].correct++;
      }

      $("#main").innerHTML = `
        <div class="page-title">📊 成績</div>
        <div class="grid-stat">
          <div class="stat-box"><div class="k">総合レベル</div><div class="v">${avgMastery}</div></div>
          <div class="stat-box"><div class="k">今週の正解率</div><div class="v">${weekRate}%</div></div>
          <div class="stat-box"><div class="k">習得スキル数</div><div class="v">${mastered}</div></div>
          <div class="stat-box"><div class="k">復習待ち</div><div class="v">${dueCount}</div></div>
        </div>
        <div class="card">
          <h3>苦手スキル TOP 3</h3>
          ${weakness.length ? weakness.map(w => `
            <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px">
              <span>${w.tag}</span><span style="color:var(--c-warn);font-weight:700">習熟 ${w.value}</span>
            </div>`).join('') : '<div style="font-size:12px;color:var(--c-muted)">まだデータがありません</div>'}
        </div>
        <div class="card">
          <h3>頻発リーク TOP 5</h3>
          ${topLeaks.length ? topLeaks.map(l => `
            <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px">
              <span>${l.type}</span><span style="color:var(--c-err);font-weight:700">${l.count}回</span>
            </div>`).join('') : '<div style="font-size:12px;color:var(--c-muted)">リークは記録されていません</div>'}
        </div>
        <div class="card">
          <h3>カテゴリ別成績</h3>
          ${Object.keys(catStats).length ? Object.entries(catStats).map(([k, v]) => `
            <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px">
              <span>${k}</span><span>${v.correct}/${v.total} (${Math.round(v.correct / v.total * 100)}%)</span>
            </div>`).join('') : '<div style="font-size:12px;color:var(--c-muted)">まだデータがありません</div>'}
        </div>
        <button class="btn ghost block" id="open-admin">▶ 管理画面を開く（問題追加・検証）</button>
        <button class="btn ghost block" id="open-settings" style="margin-top:8px">▶ 設定・データ管理</button>
      `;
      const b1 = $("#open-admin"); if (b1) b1.addEventListener("click", renderAdmin);
      const b2 = $("#open-settings"); if (b2) b2.addEventListener("click", renderSettings);
      renderBottomNav();
    } catch (e) {
      showError("成績描画エラー: " + e.message, e.stack);
    }
  }

              <button class="btn primary block" id="run-validate">▶ 全問題を検証</button>
              <div id="validate-result" style="margin-top:12px"></div>
            </div>`;
          const b = $("#run-validate"); if (b) b.addEventListener("click", runValidation);
        }
      }
      $$(".admin-tab button").forEach(b => b.addEventListener("click", () => tab(b.dataset.tab)));
      const back = $("#admin-back"); if (back) back.addEventListener("click", renderStats);
      tab("dash");
    } catch (e) {
      showError("管理画面エラー: " + e.message, e.stack);
    }
  }

  function downloadCSVTemplate() {
    const headers = ["id", "category", "skillTags", "level", "difficulty", "gameFormat", "tableSize", "heroPosition", "blindsSB", "blindsBB", "ante", "effectiveStack", "prefloAction_json", "board", "pot", "decisionPoint", "heroHand", "actions", "sizes_json", "correctAction", "correctSize", "beginnerExplain", "advancedExplain", "memoryLine", "commonMistake", "conditionVariation", "sourceType", "status"];
    const sample = ["Q_NEW_001", "preflop", "rfi,position_open", "1", "2", "MTT", "9", "BTN", "100", "200", "25", "20000", "[]", "", "525", "preflop_open", "As;Ks", "Fold;Raise", '[{"label":"2.2BB","value":440}]', "Raise", "2.2BB", "AKsはBTN最強クラス。", "AKsはBTNレンジの中核。", "AKsはBTNで必ずレイズ。", "リンプ混ぜて主導権を失う。", "UTGでもレイズだがサイズ大きめ。", "THEORY-BASED", "review"];
    const csv = headers.join(",") + "\n" + sample.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",");
    const blob = new Blob([csv], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "poker-drill-template.csv"; a.click();
    toast("CSVテンプレートをダウンロードしました");
  }

  function downloadJSONTemplate() {
    const sample = [window.INITIAL_QUESTIONS[0]];
    const blob = new Blob([JSON.stringify(sample, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "poker-drill-template.json"; a.click();
    toast("JSONテンプレートをダウンロードしました");
  }

  async function doImport() {
    const f = $("#import-file").files[0];
    if (!f) { toast("ファイルを選択してください"); return; }
    const text = await f.text();
    let list = [];
    try {
      if (f.name.endsWith(".json")) {
        list = JSON.parse(text);
        if (!Array.isArray(list)) throw new Error("配列である必要があります");
      } else {
        list = parseCSV(text);
      }
    } catch (e) {
      $("#import-result").innerHTML = `<div style="color:var(--c-err)">パースエラー: ${e.message}</div>`;
      return;
    }
    let ok = 0, err = 0;
    const errs = [];
    for (const q of list) {
      const v = LOGIC.validateQuestion(q);
      if (v.ok) {
        q.status = "review"; q.validation = "verified";
        await DB.put("Question", q); ok++;
      } else {
        err++; errs.push({ id: q.id, errors: v.errors });
      }
    }
    $("#import-result").innerHTML = `
      <div class="stat-box"><div class="k">取込完了</div><div class="v" style="color:var(--c-ok)">${ok}問</div></div>
      <div class="stat-box" style="margin-top:6px"><div class="k">検証エラー（スキップ）</div><div class="v" style="color:var(--c-err)">${err}問</div></div>
      ${errs.length ? '<details style="margin-top:8px"><summary style="font-size:12px;cursor:pointer">エラー詳細</summary><pre style="font-size:11px;background:var(--c-surface-2);padding:8px;border-radius:6px;overflow:auto;max-height:200px">' + errs.map(e => `${e.id}: ${e.errors.join(', ')}`).join('\n') + '</pre></details>' : ''}
    `;
    toast(`${ok}問を取り込みました`);
  }

  function parseCSV(text) {
    const lines = text.split(/\r?\n/).filter(Boolean);
    const headers = parseCSVLine(lines[0]);
    return lines.slice(1).map(line => {
      const vals = parseCSVLine(line);
      const obj = {};
      headers.forEach((h, i) => obj[h] = vals[i]);
      return {
        id: obj.id, category: obj.category,
        skillTags: (obj.skillTags || "").split(",").map(s => s.trim()).filter(Boolean),
        level: +obj.level, difficulty: +obj.difficulty,
        gameFormat: obj.gameFormat, tableSize: +obj.tableSize,
        heroPosition: obj.heroPosition,
        blinds: { sb: +obj.blindsSB, bb: +obj.blindsBB },
        ante: +obj.ante || 0,
        effectiveStack: +obj.effectiveStack,
        stacks: {},
        prefloAction: safeJSON(obj.prefloAction_json, []),
        board: (obj.board || "").split(";").filter(Boolean),
        pot: +obj.pot,
        decisionPoint: obj.decisionPoint,
        heroHand: (obj.heroHand || "").split(";").filter(Boolean),
        actions: (obj.actions || "").split(";").filter(Boolean),
        sizes: safeJSON(obj.sizes_json, []),
        correctAction: obj.correctAction,
        correctSize: obj.correctSize || null,
        acceptableActions: [obj.correctAction],
        beginnerExplain: obj.beginnerExplain,
        advancedExplain: obj.advancedExplain,
        memoryLine: obj.memoryLine,
        commonMistake: obj.commonMistake,
        conditionVariation: obj.conditionVariation,
        sourceType: obj.sourceType,
        status: obj.status || "review",
        validation: "pending",
        visualHints: {},
        relatedIds: []
      };
    });
  }
  function parseCSVLine(line) {
    const result = []; let cur = ""; let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (inQ) {
        if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
        else if (ch === '"') { inQ = false; }
        else { cur += ch; }
      } else {
        if (ch === ',') { result.push(cur); cur = ""; }
        else if (ch === '"') { inQ = true; }
        else { cur += ch; }
      }
    }
    result.push(cur); return result;
  }
  function safeJSON(s, def) { try { return JSON.parse(s); } catch (e) { return def; } }

  async function publishAllReview() {
    const qs = await DB.all("Question");
    let n = 0;
    for (const q of qs) {
      if (q.status === "review" && q.validation !== "error") {
        q.status = "published"; await DB.put("Question", q); n++;
      }
    }
    toast(`${n}問を公開しました`);
    renderAdmin();
  }

  async function runValidation() {
    const qs = await DB.all("Question");
    const rep = LOGIC.validateAll(qs);
    for (const e of rep.errors) {
      const q = qs.find(x => x.id === e.id);
      if (q && q.status === "published") { q.status = "review"; q.validation = "error"; await DB.put("Question", q); }
    }
    $("#validate-result").innerHTML = `
      <div class="grid-stat">
        <div class="stat-box"><div class="k">総問題数</div><div class="v">${rep.total}</div></div>
        <div class="stat-box"><div class="k">検証OK</div><div class="v" style="color:var(--c-ok)">${rep.ok}</div></div>
        <div class="stat-box"><div class="k">エラー</div><div class="v" style="color:var(--c-err)">${rep.errors.length}</div></div>
        <div class="stat-box"><div class="k">ID重複</div><div class="v" style="color:var(--c-warn)">${rep.duplicates.length}</div></div>
      </div>
      ${rep.errors.length ? '<details style="margin-top:8px"><summary style="font-size:12px;cursor:pointer">エラー詳細</summary><pre style="font-size:11px;background:var(--c-surface-2);padding:8px;border-radius:6px;overflow:auto;max-height:300px">' + rep.errors.map(e => `${e.id}: ${e.errors.join(', ')}`).join('\n') + '</pre></details>' : '<div style="margin-top:8px;color:var(--c-ok);font-weight:600">✓ 全問題が検証OK</div>'}
    `;
    toast("検証を実行しました");
  }

  // ========== SETTINGS ==========
  async function renderSettings() {
    state.view = "settings";
    try {
      $("#main").innerHTML = `
        <div class="page-title">⚙ 設定</div>
        <div class="card">
          <h3>デッキ表示</h3>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div><div>4色デッキを使う</div><div style="font-size:11px;color:var(--c-muted)">♥赤 ♦青 ♣緑 ♠黒</div></div>
            <input type="checkbox" id="four-color" ${state.settings.fourColorDeck ? 'checked' : ''}/>
          </div>
        </div>
        <div class="card">
          <h3>データ管理</h3>
          <button class="btn ghost block" id="export-data">📥 全データを書き出し(JSON)</button>
          <button class="btn ghost block" id="import-data" style="margin-top:8px">📤 データを読み込み(JSON)</button>
          <input type="file" id="import-data-file" accept=".json" style="display:none"/>
          <hr class="sep">
          <button class="btn err block" id="reset-data">⚠ 全データをリセット</button>
        </div>
        <div class="card">
          <h3>アプリ情報</h3>
          <div style="font-size:12px;color:var(--c-muted);line-height:1.8">
            ・データはブラウザ内(IndexedDB)に永続保存<br>
            ・ページを閉じても・再起動後も進捗保持<br>
            ・PWAでホーム画面追加可能<br>
            ・オフライン動作対応<br>
            ・v2.0.0
          </div>
        </div>
        <button class="btn ghost block" id="back-stats">← 成績へ戻る</button>
      `;
      const fc = $("#four-color");
      if (fc) fc.addEventListener("change", async (e) => {
        state.settings.fourColorDeck = e.target.checked;
        const s = await DB.all("AppSettings");
        const rec = s[0] || { id: "app_" + state.userId, userId: state.userId };
        rec.fourColorDeck = e.target.checked;
        await DB.put("AppSettings", rec);
        toast("設定を保存しました");
      });
      const eb = $("#export-data");
      if (eb) eb.addEventListener("click", async () => {
        const data = await DB.exportAll();
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = `poker-drill-backup-${Date.now()}.json`; a.click();
        toast("エクスポートしました");
      });
      const ib = $("#import-data");
      const ibf = $("#import-data-file");
      if (ib && ibf) ib.addEventListener("click", () => ibf.click());
      if (ibf) ibf.addEventListener("change", async (e) => {
        const f = e.target.files[0]; if (!f) return;
        const text = await f.text();
        try {
          await DB.importAll(JSON.parse(text));
          toast("インポートしました。再読み込みします...");
          setTimeout(() => location.reload(), 1000);
        } catch (err) { toast("エラー: " + err.message); }
      });
      const rb = $("#reset-data");
      if (rb) rb.addEventListener("click", async () => {
        if (!confirm("全データを削除します。よろしいですか？")) return;
        for (const s of DB.STORES) await DB.clearStore(s);
        toast("リセットしました。再読み込みします...");
        setTimeout(() => location.reload(), 800);
      });
      const back = $("#back-stats");
      if (back) back.addEventListener("click", renderStats);
      renderBottomNav();
    } catch (e) {
      showError("設定画面エラー: " + e.message, e.stack);
    }
  }

  return { init };
})();

// DOMContentLoadedは発火後に登録すると呼ばれないため、readyStateを確認して即時実行を別パスで確保
function __bootAPP() {
  try {
    var main = document.getElementById("main");
    if (main) main.innerHTML = '<div style="padding:20px;text-align:center;color:#8892a4">初期化中... (ステップ1/3)</div>';
    if (typeof APP === "undefined" || !APP || typeof APP.init !== "function") {
      if (main) main.innerHTML = '<div style="padding:20px;color:#a83d3d"><h3>スクリプト読み込み失敗</h3><p>APPオブジェクトが存在しません。ページを再読み込みしてください。</p><button onclick="location.reload()" style="padding:12px 24px;background:#1e3a5f;color:#fff;border:0;border-radius:8px;font-size:15px">再読み込み</button></div>';
      return;
    }
    if (main) main.innerHTML = '<div style="padding:20px;text-align:center;color:#8892a4">初期化中... (ステップ2/3)</div>';
    APP.init();
  } catch (e) {
    var m = document.getElementById("main");
    if (m) {
      m.innerHTML =
        '<div style="padding:20px;border-left:4px solid #a83d3d;background:#fff">' +
        '<h3 style="color:#a83d3d">起動エラー</h3>' +
        '<pre style="font-size:11px;white-space:pre-wrap;background:#f5f5f5;padding:8px;border-radius:6px;overflow:auto;max-height:300px">' +
        (e.message || "unknown") + '\n' + (e.stack || "") + '</pre>' +
        '<button onclick="location.reload()" style="padding:12px 24px;background:#1e3a5f;color:#fff;border:0;border-radius:8px;font-size:15px;margin-top:12px">再読み込み</button>' +
        '</div>';
    }
  }
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", __bootAPP);
} else {
  // すでにDOM準備完了の場合はマイクロタスクで即時実行
  setTimeout(__bootAPP, 0);
}
